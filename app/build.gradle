plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 版本号与包名的唯一来源：versionCode / versionName / 桌面应用名 / APK 文件名都由这里生成，避免脱节。
// 规则：任何代码或资源变更都必须升版本（versionCode +1，versionName 递增），不要保持旧版本号。
def appVersionCode = 5
def appVersionName = '1.0.4'
def appPackageName = 'com.aishangban.auto'
def appDisplayName = "爱上班 v${appVersionName}"

android {
    namespace 'com.aishangban.auto'
    compileSdk 34

    defaultConfig {
        applicationId appPackageName
        minSdk 31
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        // 应用名 = 软件名 + 版本号，升版本时自动同步，无需手动改字符串资源
        resValue 'string', 'app_name', appDisplayName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // APK 文件名带上软件名、版本号与包名，方便本地存档区分
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "爱上班_v${appVersionName}_${appPackageName}_${variant.buildType.name}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
